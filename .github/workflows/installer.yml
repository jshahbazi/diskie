name: Signed installer

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        required: true
        type: choice
        default: patch
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: diskie-signed-installer
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  installer:
    name: Build, sign and notarize the installer
    if: github.repository == 'jshahbazi/diskie' && github.ref == 'refs/heads/main'
    runs-on: macos-26
    timeout-minutes: 75
    environment: macos-release
    outputs:
      version: ${{ steps.release.outputs.version }}
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.24'
          python-version: '3.13.13'
          enable-cache: false
      - name: Select the pinned Python runtime
        run: dirname "$(uv python find --managed-python 3.13.13)" >> "$GITHUB_PATH"
      - name: Check the exact source and Apple silicon runner
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          xcodebuild -version
      - name: Select the next release version
        id: release
        env:
          VERSION_BUMP: ${{ inputs.bump }}
        run: python scripts/release_version.py --bump "$VERSION_BUMP"
      - name: Set the application release version
        env:
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: echo "DISKIE_RELEASE_VERSION=$RELEASE_VERSION" >> "$GITHUB_ENV"
      - name: Build and test before importing Apple credentials
        run: |
          ./scripts/build.sh
          python -m unittest discover -s tests -v
          node tests/test_chart.cjs
      - name: Import temporary Apple credentials
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: python .github/scripts/apple_credentials.py setup
      - name: Sign and notarize the app and disk image
        env:
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          python scripts/sign_installer.py --source "$GITHUB_SHA" \
            --keychain "$RUNNER_TEMP/diskie-signing/signing.keychain-db"
      - name: Remove temporary Apple credentials
        if: always()
        run: python .github/scripts/apple_credentials.py cleanup
      - name: Verify the installer after credential cleanup
        run: python scripts/sign_installer.py --verify-only --source "$GITHUB_SHA"
      - name: Upload the verified installer and receipts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Diskie-signed-${{ github.sha }}-${{ github.run_attempt }}
          path: dist/signed-installer/*
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

  publish:
    name: Publish the verified GitHub release
    needs: installer
    if: github.repository == 'jshahbazi/diskie' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.installer.outputs.artifact_id }}
          path: dist/signed-installer
          merge-multiple: true
      - name: Publish a new latest release without replacing existing assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_VERSION: ${{ needs.installer.outputs.version }}
        run: |
          set -euo pipefail
          python3 scripts/release_assets.py --source "$GITHUB_SHA" --version "$RELEASE_VERSION" \
            --assets dist/signed-installer --notes "$RUNNER_TEMP/release-notes.md"
          tag="v$RELEASE_VERSION"
          if gh release view "$tag" --repo "$GH_REPO" >/dev/null 2>&1; then
            echo 'A release already exists for this version; assets are never replaced.' >&2
            exit 1
          fi
          # A retry may finish a tag created by this source's earlier attempt.
          # Existing tags are never moved, and existing releases stay untouched.
          if existing_ref=$(gh api "repos/$GH_REPO/git/ref/tags/$tag" \
              --jq '.object.type + ":" + .object.sha' 2>/dev/null); then
            if [ "$existing_ref" != "commit:$GITHUB_SHA" ]; then
              echo 'The existing tag does not match this source revision.' >&2
              exit 1
            fi
          else
            gh api --method POST "repos/$GH_REPO/git/refs" \
              -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA" --silent
          fi
          cd dist/signed-installer
          stem="diskie-$RELEASE_VERSION-aarch64-apple-darwin"
          gh release create "$tag" \
            "$stem.dmg" "$stem.dmg.sha256" Diskie.dmg Diskie.dmg.sha256 Diskie.dmg.notarization.json \
            --repo "$GH_REPO" --verify-tag --latest --title "Diskie $RELEASE_VERSION" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
