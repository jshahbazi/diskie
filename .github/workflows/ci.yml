name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: '0.12.24'
          python-version: '3.13.13'
          enable-cache: false
      - name: Select the pinned Python runtime
        run: dirname "$(uv python find --managed-python 3.13.13)" >> "$GITHUB_PATH"
      - name: Build local app
        run: ./scripts/build.sh
      - name: Test scanner and release tools
        run: python -m unittest discover -s tests -v
      - name: Test chart navigation
        run: node tests/test_chart.cjs
      - name: Build development installer
        run: |
          ./scripts/package.sh
          hdiutil verify dist/Diskie.dmg
          (cd dist && shasum -a 256 Diskie.dmg > Diskie.dmg.sha256)
      - name: Upload development installer
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Diskie-development-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            dist/Diskie.dmg
            dist/Diskie.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
