<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Diskie</title><style>
:root{font-family:ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#e9edf5;background:#0d1320}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:42px 28px}h1{font-size:clamp(30px,4vw,44px);margin:0 0 8px;letter-spacing:-.04em}p{color:#aab7ca;line-height:1.55}.top{display:flex;justify-content:space-between;gap:20px;align-items:end}.metric{font-size:26px;font-weight:700;color:#fff}.sub{font-size:13px;color:#94a4ba}.panel{background:#141e2e;border:1px solid #29374a;border-radius:18px;margin-top:25px;padding:25px}.crumbs{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:#77899e}.crumbs button{border:0;background:none;color:#99c5ff;cursor:pointer;font:inherit;padding:4px}.crumbs button:last-child{color:white;font-weight:700}.content{display:grid;grid-template-columns:minmax(260px,440px) 1fr;gap:32px;align-items:start}.chart{position:relative;max-width:440px;width:100%;margin:auto}.chart svg{width:100%;height:auto;display:block}.chart path{cursor:pointer;stroke:#141e2e;stroke-width:2;transition:opacity .15s}.chart path:hover,.chart path:focus{opacity:.75;outline:none}.center{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;pointer-events:none;width:46%;overflow:hidden}.center strong{display:block;font-size:24px}.center span{color:#9eacc0;font-size:13px;overflow-wrap:anywhere}.list{max-height:560px;overflow:auto}.row{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 6px;border-bottom:1px solid #273449;cursor:pointer}.row:hover{background:#1d2a3d}.row[aria-disabled=true]{cursor:default}.dot{width:10px;height:10px;border-radius:50%}.name{overflow-wrap:anywhere}.value{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}.value small{display:block;color:#93a3b8}.notice{font-size:13px;color:#9eacc0}.empty{color:#aab7ca;padding:20px 0}button{font-family:inherit}@media(max-width:720px){main{padding:26px 16px}.top{display:block}.content{grid-template-columns:1fr}.chart{max-width:320px}.panel{padding:18px}.list{max-height:none}}
</style></head><body><main><div class="top"><div><h1>Diskie</h1><p>Explore the biggest folders and files on your Mac.</p></div><div><div class="metric" id="capacity"></div><div class="sub" id="stamp"></div></div></div><div class="panel"><nav class="crumbs" id="crumbs" aria-label="Folder path"></nav><div class="content"><div class="chart"><svg id="chart" viewBox="0 0 400 400" role="img" aria-label="Disk usage chart"></svg><div class="center"><strong id="size"></strong><span id="label"></span></div></div><div><div class="list" id="list"></div><p class="notice">Select a folder or slice to drill down. Individual files and folders under 100 MiB are grouped into “Other”.</p></div></div></div><p class="notice" id="notes"></p></main><script>
window.showData = function(DATA) {
const palette=['#69a8ff','#8a81ff','#45d1b2','#efaf67','#f27d91','#c791ed','#75c7e9','#d3cf72','#a7d987','#ed9875','#7196d5','#b9a7c9'];
const $=id=>document.getElementById(id); const fmt=n=>{if(!Number.isFinite(n))return '—';let i=0;while(n>=1024&&i<4){n/=1024;i++}return `${n.toFixed(i?1:0)} ${['B','KiB','MiB','GiB','TiB'][i]}`};
const measured=DATA.tree?.size||0, used=DATA.total-DATA.free;
const root={name:'Disk',size:DATA.total,children:[{name:'Used space (reported)',size:used,children:[{...DATA.tree,name:'Scanned data volume (estimate)',size:measured},...(used>measured?[{name:'Used space not represented by scan',size:used-measured,terminal:true}]:[])]},{name:'Available',size:DATA.free,terminal:true}]};
let stack=[root];
$('capacity').textContent=`${fmt(DATA.free)} available of ${fmt(DATA.total)}`;$('stamp').textContent=`Snapshot: ${DATA.date}`;
$('notes').textContent=`This is a point-in-time estimate based on allocated file sizes on the data volume. The volume shares APFS capacity with other volumes; snapshots, system data, permissions and shared or cloned files can make folder totals differ from actual reclaimable space. ${Object.values(DATA.errors).reduce((a,b)=>a+b,0).toLocaleString()} paths could not be read. Deleting a file does not necessarily reclaim its displayed size.`;
function getItems(node){let cs=(node.children||[]).filter(x=>x.size>0);let sum=cs.reduce((a,x)=>a+x.size,0), other=Math.max(0,node.size-sum);if(other>0)cs=[...cs,{name:'Other',size:other,terminal:true}];return cs.sort((a,b)=>b.size-a.size)}
function point(r,a){return [200+r*Math.cos(a),200+r*Math.sin(a)]}function wedge(a,b){if(b-a>=Math.PI*2-.00001)b=a+Math.PI*2-.00001;let p=point(185,a),q=point(185,b),r=point(110,b),s=point(110,a);return `M ${p} A 185 185 0 ${b-a>Math.PI?1:0} 1 ${q} L ${r} A 110 110 0 ${b-a>Math.PI?1:0} 0 ${s} Z`}
function render(){let node=stack.at(-1), items=getItems(node), denom=items.reduce((a,x)=>a+x.size,0), chart=$('chart'),list=$('list'),crumbs=$('crumbs');chart.replaceChildren();list.replaceChildren();crumbs.replaceChildren();$('size').textContent=fmt(node.size);$('label').textContent=node.name;stack.forEach((x,i)=>{if(i){let s=document.createElement('span');s.textContent='/';crumbs.append(s)}let b=document.createElement('button');b.textContent=x.name;b.onclick=()=>{stack=stack.slice(0,i+1);render()};crumbs.append(b)});if(!items.length){list.textContent='No individual entries of 100 MiB or more were recorded here.';list.className='list empty';return}list.className='list';let angle=-Math.PI/2;items.forEach((x,i)=>{let color=x.terminal?'#516176':palette[i%palette.length], end=angle+2*Math.PI*x.size/denom;let can=!!x.children?.length;let path=document.createElementNS('http://www.w3.org/2000/svg','path');path.setAttribute('d',wedge(angle,end));path.setAttribute('fill',color);path.setAttribute('tabindex',can?'0':'-1');let title=document.createElementNS('http://www.w3.org/2000/svg','title');title.textContent=`${x.name}: ${fmt(x.size)}`;path.append(title);if(can){path.onclick=()=>{stack.push(x);render()};path.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();path.onclick()}}}chart.append(path);angle=end;let row=document.createElement('div');row.className='row';row.setAttribute('role',can?'button':'listitem');row.setAttribute('aria-disabled',String(!can));if(can){row.tabIndex=0;row.onclick=()=>{stack.push(x);render()};row.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();row.onclick()}}}let dot=document.createElement('span');dot.className='dot';dot.style.background=color;let name=document.createElement('span');name.className='name';name.textContent=x.name+(x.file?' (file)':'');let value=document.createElement('span');value.className='value';value.textContent=fmt(x.size);let pct=document.createElement('small');pct.textContent=(100*x.size/denom).toFixed(1)+'%';value.append(pct);row.append(dot,name,value);list.append(row)})}render(); };
</script></body></html>
